name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install motion renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Generate gift catalogue
        run: python generate_catalog.py
      - name: Ensure ffmpeg and ffprobe are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Render original animated vertical video
        run: python generate_motion.py
      - name: Validate generated site
        run: python verify_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test public Pages and SEO endpoints
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          base = 'https://ki9177997007-rgb.github.io/podarochny-perepoloh/'
          checks = [
              ('', 'Подарочный'.encode('utf-8')),
              ('sitemap.xml', b'<urlset'),
              ('robots.txt', b'Sitemap:'),
              ('tovar-powerbank.html', b'<title'),
          ]
          for path, expected in checks:
              url = base + path
              for attempt in range(8):
                  try:
                      with urlopen(url, timeout=15) as response:
                          body = response.read()
                          if response.status != 200 or expected not in body:
                              raise RuntimeError(f'Unexpected public content at {url}')
                      print(f'PUBLIC OK: {url}')
                      break
                  except Exception as exc:
                      if attempt == 7:
                          raise RuntimeError(f'Public smoke test failed: {url}') from exc
                      time.sleep(10)
          PY
