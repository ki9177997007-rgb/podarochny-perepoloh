name: Check Takprodam API
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify API token is configured
        env:
          TAKPRODAM_API_TOKEN: ${{ secrets.TAKPRODAM_API_TOKEN }}
        run: |
          if [ -z "$TAKPRODAM_API_TOKEN" ]; then
            echo "::error::TAKPRODAM_API_TOKEN is missing in repository Actions secrets"
            exit 1
          fi
          echo "API token is configured"
      - name: Check publisher sources
        env:
          TAKPRODAM_API_TOKEN: ${{ secrets.TAKPRODAM_API_TOKEN }}
        run: python3 takprodam_api.py
